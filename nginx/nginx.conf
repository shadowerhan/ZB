user nginx; worker_processes auto; error_log /var/log/nginx/error.log warn; pid /var/run/nginx.pid;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types; default_type application/octet-stream; server_tokens off;
  log_format privacy '$remote_addr - $request_method $uri $status $body_bytes_sent'; access_log /var/log/nginx/access.log privacy;
  limit_req_zone $binary_remote_addr zone=general:10m rate=15r/s; limit_req_zone $binary_remote_addr zone=sensitive:10m rate=3r/s;
  gzip on; gzip_vary on; gzip_min_length 1024; gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  upstream nextjs { server web:3000; keepalive 32; }
  server { listen 80; server_name example.com www.example.com; return 301 https://example.com$request_uri; }
  server {
    listen 443 ssl http2; server_name www.example.com; ssl_certificate /etc/nginx/certs/fullchain.pem; ssl_certificate_key /etc/nginx/certs/privkey.pem; return 301 https://example.com$request_uri;
  }
  server {
    listen 443 ssl http2; server_name example.com; client_max_body_size 8m;
    ssl_certificate /etc/nginx/certs/fullchain.pem; ssl_certificate_key /etc/nginx/certs/privkey.pem; ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always; add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;
    location /_next/static/ { proxy_pass http://nextjs; expires 365d; add_header Cache-Control "public, immutable"; }
    location ~ ^/(api/auth|api/contact) { limit_req zone=sensitive burst=5 nodelay; proxy_pass http://nextjs; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location / { limit_req zone=general burst=30 nodelay; proxy_pass http://nextjs; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  }
}
